<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Royal Enfield</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-container {
            background-color: #1a1a1a;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #d32f2f;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #d32f2f;
            border: none;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #b71c1c;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #aaa;
            font-size: 14px;
        }

        .back-link a:hover {
            color: #d32f2f;
        }
    </style>
</head>

<body>

<div class="contact-container">
    <h1>Contact Us</h1>

    <form action="https://formspree.io/f/mreazlbk" method="POST">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email *</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Message *</label>
            <textarea name="message" rows="5" placeholder="Enter your message" required></textarea>
        </div>

        <!-- Optional redirect -->
        <input type="hidden" name="_redirect" value="thankyou.html">

        <button type="submit">Send Message</button>
    </form>

    <div class="back-link">
        <a href="index.html">← Back to Home</a>
    </div>
</div>

</body>
</html>
